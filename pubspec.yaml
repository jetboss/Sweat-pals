name: sweat_pals
description: "A private, offline-first mobile app for couples and buddies to track weight loss and fitness goals together."
publish_to: 'none'
version: 1.0.1+6

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  shared_preferences: ^2.2.2
  drift: ^2.24.2
  drift_flutter: ^0.2.2
  sqlite3_flutter_libs: ^0.5.25
  fl_chart: ^1.1.1
  intl: ^0.20.2
  uuid: ^4.5.2
  path_provider: ^2.1.2
  image_picker: ^1.2.1
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  path: ^1.9.0

  lottie: ^3.1.0 # Vector animations
  cached_network_image: ^3.3.1 # Image caching for workout visuals
  google_fonts: ^7.0.2 # Premium typography
  just_audio: ^0.10.5 # Audio playback for fetched TTS
  flutter_tts: ^4.2.3
  audio_session: ^0.2.2

  # Backend & Auth
  supabase_flutter: ^2.0.0
  health: ^13.2.1
  permission_handler: ^12.0.1
  confetti: ^0.8.0

  connectivity_plus: ^7.0.0
  geolocator: ^14.0.2
  flutter_animate: ^4.5.2
  go_router: ^17.1.0
  rive: ^0.13.20


dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.0
  flutter_lints: ^6.0.0
  build_runner: ^2.4.7
  riverpod_generator: ^4.0.0
  drift_dev: ^2.24.2
  flutter_native_splash: ^2.3.13
  flutter_launcher_icons: ^0.14.4

  hive: any
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#ffffff"
  image: "assets/images/app_icon.png"
  android_12:
    image: "assets/images/app_icon.png"
    color: "#ffffff"
  ios: true
